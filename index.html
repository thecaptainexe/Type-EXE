<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeEXE | Minimal Typing Test</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="theme-mocha">
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
                TypeEXE
            </div>
            <div class="config-bar">
                <div class="config-group" id="modifiers">
                    <button class="config-btn" data-mod="punctuation">@#</button>
                    <button class="config-btn" data-mod="numbers">123</button>
                </div>
                <div class="divider"></div>
                <div class="config-group" id="modes">
                    <button class="config-btn active" data-mode="time">time</button>
                    <button class="config-btn" data-mode="quote">quote</button>
                    <button class="config-btn" data-mode="zen">zen</button>
                </div>
                <div class="divider" id="time-divider"></div>
                <div class="config-group" id="time-options">
                    <button class="config-btn" data-time="5">5</button>
                    <button class="config-btn active" data-time="15">15</button>
                    <button class="config-btn" data-time="30">30</button>
                </div>
            </div>
        </header>

        <!-- Main Typing Area -->
        <main>
            <div id="test-wrapper">
                <div id="timer">15</div>
                <div id="words" class="words-container">
                    <div class="caret" id="caret"></div>
                </div>
                <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>

            <!-- Results Screen with Chart -->
            <div id="results" class="hidden">
                <div class="stats-grid">
                    <div class="stat">
                        <div class="stat-title">wpm</div>
                        <div class="stat-value" id="wpm">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-title">acc</div>
                        <div class="stat-value" id="acc">0%</div>
                    </div>
                    <div class="stat">
                        <div class="stat-title">raw</div>
                        <div class="stat-value" id="raw">0</div>
                    </div>
                </div>
                
                <div class="chart-wrapper">
                    <canvas id="wpmChart"></canvas>
                </div>
            </div>
            
            <button id="restart-btn" class="icon-btn" title="Restart Test">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
        </main>

        <!-- Fixed Bottom Footer -->
        <footer>
            <div class="footer-left">
                <div class="theme-selector">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <select id="theme-select">
                        <option value="mocha">Mocha</option>
                        <option value="macchiato">Macchiato</option>
                        <option value="frappe">Frappé</option>
                        <option value="latte">Latte</option>
                    </select>
                </div>
            </div>

            <div class="footer-center">
                <span class="copyright">&copy; CaptainEXE 2026</span>
            </div>
            
            <div class="footer-right">
                <a href="https://thecaptainexe.vercel.app" target="_blank" class="dev-pill">
                    <img src="https://thecaptainexe.vercel.app/assets/logo.png" alt="CaptainEXE Logo" class="pill-logo">
                    Developed By CaptainEXE
                </a>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
